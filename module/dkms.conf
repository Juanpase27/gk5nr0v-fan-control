PACKAGE_NAME="gk5nr0v-fans"
PACKAGE_VERSION="1.0.0"
BUILT_MODULE_NAME[0]="gk5nr0v-fans"
DEST_MODULE_LOCATION[0]="/extra"
# CachyOS kernels are built with Clang/LLD + ThinLTO: out-of-tree modules
# must use the same toolchain or gcc chokes on the recorded flags.
MAKE[0]="make CC=clang LD=ld.lld -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make CC=clang LD=ld.lld -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
